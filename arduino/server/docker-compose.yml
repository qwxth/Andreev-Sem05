name: server

services:
  postgres:
    image: postgres:15
    container_name: water_postgres
    environment:
      POSTGRES_DB: water_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: water123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d water_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  app:
    image: water-meter-app:local
    build: .
    container_name: water_server
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: water_db
      DB_USER: postgres
      DB_PASSWORD: water123
      ESP_READING_URL: ${ESP_READING_URL:-http://192.168.4.1/reading}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-true}
      POLL_INTERVAL_SECONDS: "5"
      POLL_TIMEOUT_SECONDS: "3"
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ping', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
    name: server_pgdata
